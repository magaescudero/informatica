<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 2 - Verificar edad</title>
</head>
<body style="font-family:Arial; text-align:center;">
<h2> Verificar edad</h2>
<button onclick="verificarEdad()">Ingresar edad</button>
<p id="resultado"></p>

<script>
function verificarEdad() {
  let edad = parseInt(prompt("Ingresa tu edad:"));
  let msg = (edad >= 18) ? "Acceso permitido" : "Acceso denegado";
  document.getElementById("resultado").innerText = msg;
}
</script>
</body>
</html>
