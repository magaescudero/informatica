<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de IMC (Índice de Masa Corporal)</title>
<style>
  body { font-family: Arial; text-align: center; margin-top: 50px; }
  input { margin: 5px; padding: 8px; width: 150px; }
  button { padding: 8px 15px; cursor: pointer; }
</style>
</head>
<body>

<form id="formIMC">
  <input type="number" id="peso" placeholder="Peso (kg)" required>
  <input type="number" id="altura" placeholder="Altura (m)" step="0.01" required>
  <button type="button" onclick="calcularIMC()">Calcular IMC</button>
</form>

<p id="resultado"></p>

<script>
function calcularIMC() {
  const peso = parseFloat(document.getElementById("peso").value);
  const altura = parseFloat(document.getElementById("altura").value);

  if (peso <= 0 || altura <= 0 || isNaN(peso) || isNaN(altura)) {
    document.getElementById("resultado").innerText = "Por favor, ingresa valores válidos.";
    return;
  }

  const imc = peso / (altura * altura);
  let estado = "";

  if (imc < 18.5) estado = "Bajo peso";
  else if (imc < 25) estado = "Peso normal";
  else if (imc < 30) estado = "Sobrepeso";
  else estado = "Obesidad";

  document.getElementById("resultado").innerText =
    `Tu IMC es: ${imc.toFixed(2)} → ${estado}`;
}
</script>
</body>
</html>
