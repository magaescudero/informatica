<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 5 - Formulario estudiante</title>
</head>
<body style="font-family:Arial; text-align:center;">
<h2>Formulario estudiante</h2>
<form id="formAlumno">
  <input type="text" id="nombre" placeholder="Nombre" required>
  <input type="text" id="apellido" placeholder="Apellido" required>
  <input type="text" id="curso" placeholder="Curso" required>
  <button type="button" onclick="saludarAlumno()">Enviar</button>
</form>
<p id="saludo"></p>

<script>
function saludarAlumno() {
  let nombre = document.getElementById("nombre").value;
  let apellido = document.getElementById("apellido").value;
  let curso = document.getElementById("curso").value;
  document.getElementById("saludo").innerText = 
    `Bienvenido ${nombre} ${apellido} del curso ${curso} `;
}
</script>
</body>
</html>
